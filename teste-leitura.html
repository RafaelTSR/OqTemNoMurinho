<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de leitura do Murinho</title>
</head>
<body>
    <h1>Produtos do Firestore</h1>

    <script type="module">
    import {
        listarProdutosRecentes,
        buscarProdutoPorId
    } from "../backend/produtos.js";

    try {
        const produtos = await listarProdutosRecentes();
        console.table(produtos);

        if (produtos.length > 0) {
            // Simula um clique no primeiro card do Feed.
            const primeiroProduto = produtos[0];
            const produto = await buscarProdutoPorId(primeiroProduto.id);

            console.log("Produto que abriria na página do post:", produto);
        }
    } catch (erro) {
        console.error("Falha na leitura:", erro);
    }
</script>
</body>
</html>
