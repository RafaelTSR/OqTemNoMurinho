<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Imagens/Design_sem_nome-removebg-preview.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="murinhoPostStyle.css">
  <title>Postagem</title>
  <link rel="stylesheet" href="murinhoFuncionalStyle.css">
</head>
<body>
  <section id="post" class="tela tela-post">

     <nav class="sidebar">
      <div class="sidebar__logo">
        <img src="Imagens/O_que_tem_no_murinho_-_Identidade_Visual-removebg-preview.png" alt="Logo" class="sidebar__logo-img">
      </div>

      <ul class="sidebar__menu">
        <li><a href="MurinhoFeed.html" class="sidebar__link" title="Início">
            <img src="Imagens/casa.png" alt="Início" class="sidebar__icone">
             <span class="sidebar__texto">Início</span>
        </a></li>
        
        <li><a href="MurinhoFeed.html" class="sidebar__link" title="Explorar">
            <img src="Imagens/cupcake.png" alt="Explorar" class="sidebar__icone">
             <span class="sidebar__texto">Explorar</span>
        </a></li>

        <li><a href="MurinhoCriarPost.html" class="sidebar__link" title="Criar Post">
            <img src="Imagens/adicionar.png" alt="Criar post" class="sidebar__icone">
             <span class="sidebar__texto">Criar post</span>
        </a></li>
      </ul>
      <ul class="sidebar__rodape">
         <li><a href="#ilustrativo" class="sidebar__link" title="Configurações">
            <img src="Imagens/configuracoes.png" alt="Configurações" class="sidebar__icone">
        </a></li>
         <li><button type="button" class="sidebar__link sidebar__sair" data-sair hidden title="Sair" aria-label="Sair">
            <img src="Imagens/saida-de-emergencia.png" alt="" class="sidebar__icone">
        </button></li>
      </ul>
    </nav>

    <main class="conteudo">
      <header class="topo">
        <h2 class="msg__inicial">OLÁ, MACIE!</h2>
        <form class="busca">
          <button type="submit" class="busca__botao">
            <img src="Imagens/lupa.png" alt="" class="busca__icone">
          </button>
          <input type="search" class="busca__campo" placeholder="Procure por...">
        </form>
      </header>

      <p id="mensagem-post" class="mensagem-murinho" role="status">Carregando produto…</p>

      <!-- As seções aparecem quando a consulta encontra o ID vindo do Feed. -->
      <section class="post-principal" hidden>
        <img alt="" class="post-principal__imagem">
        <div class="post-principal__vendedor">
          <img src="Imagens/avatar1.jpg" alt="" class="post-principal__avatar">
          <h3 class="post-principal__nome"></h3>
        </div>
        <div class="post-principal__preco">
          <p class="preco"></p>
        </div>
      </section>

      <section class="descricao" hidden>
        <h5 class="descricao__titulo">Descrição do vendedor</h5>
        <p class="descricao__texto"></p>
      </section>
    </main>
  </section>
  <script type="module" src="backend/post.js"></script>
</body>
</html>
